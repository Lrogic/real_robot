# FoundationPose recovery with an HF SAM video tracker (run.sh ... --recovery).
# Used only with --recovery; explicit CLI flags override these values.
# Without --recovery none of this applies (camera stays 640x480 @ 30 fps, setup uses SAM3 --checkpoint).

camera:
  # Setup and tracking both use these unless --width/--height/--fps are given.
  # Undistortion keeps its normal default (off, --undistort to enable).
  width: 640
  height: 480
  fps: 60

sam:
  # sam3 (facebook/sam3 tracker), sam2-small (sam2.1-hiera-small), sam2-base-plus (sam2.1-hiera-base-plus).
  # The same model creates the setup masks and tracks during recovery.
  model: sam2-small
  tracking_fps: 2.0       # maximum SAM request rate; FP runs on every loop iteration
  hf_cache: /bigdata/luka/models/hf   # offline HF cache with the weights (not the setup --checkpoint)
  warmup_steps: 5         # tracking requests on a disposable session before the trial (excluded from timing)

recovery:
  iou_threshold: 0.4      # FP silhouette vs SAM mask IoU below this counts as one mismatch
  failure_limit: 3        # consecutive mismatching SAM observations that trigger re-registration
