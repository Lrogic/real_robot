# conda env create -f environment.yml && conda activate wxai_mjlab
# torch comes from the cu128 index so Blackwell GPUs (RTX 50xx, sm_120) work.
name: wxai_mjlab
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - mjlab==1.6.0
      - mujoco==3.11.0
      - mujoco-warp==3.11.0
      - warp-lang==1.17.0
      - rsl-rl-lib==5.4.2
      - wandb<0.29
      - pytest
      - -e .
